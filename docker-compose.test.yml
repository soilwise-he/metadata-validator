services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: soilwise
      POSTGRES_USER: soilwise
      POSTGRES_PASSWORD: soilwise
    volumes:
      - ./tests/fixtures/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soilwise -d soilwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  bootstrap-test:
    build: .
    entrypoint: python /app/bootstrap_schema.py
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: soilwise
      POSTGRES_USER: soilwise
      POSTGRES_PASSWORD: soilwise
    depends_on:
      postgres:
        condition: service_healthy
